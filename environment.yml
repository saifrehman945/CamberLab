name: openfoam
channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python runtime ───────────────────────────────────────────────────────────
  - python=3.11

  # ── Design of Experiments ────────────────────────────────────────────────────
  - pip:
    - pyDOE2>=1.3.0

  # ── Meshing ──────────────────────────────────────────────────────────────────
    - gmsh>=4.11.0

  # ── Data handling ────────────────────────────────────────────────────────────
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.11.0

  # ── Surrogate models ─────────────────────────────────────────────────────────
  - scikit-learn>=1.3.0
  - pip:
    - smt>=2.3.0

  # ── Sensitivity analysis ─────────────────────────────────────────────────────
  - pip:
    - SALib>=1.4.7

  # ── Visualization ────────────────────────────────────────────────────────────
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.18.0
  - streamlit>=1.31.0

  # ── Utilities ────────────────────────────────────────────────────────────────
  - joblib>=1.3.0
  - tqdm>=4.65.0
  - jinja2>=3.1.0

  # ── Optional: KAN surrogate ──────────────────────────────────────────────────
  # - pytorch>=2.0.0
  # - pip:
  #   - kan>=0.0.5
